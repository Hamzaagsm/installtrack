name: Build InstallTrack v2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew || true
          gradle assembleDebug --no-daemon -x lint
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk InstallTrack-v2.apk
          ls -la InstallTrack-v2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstallTrack-v2-apk
          path: InstallTrack-v2.apk
