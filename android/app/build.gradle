plugins { id 'com.android.application' }
android {
    namespace 'com.hamza.installtrack'
    compileSdk 34
    defaultConfig {
        applicationId "com.hamza.installtrack"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { signingConfig signingConfigs.debug; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // QR provisioning code banane ke liye (QrActivity) — ZXing core
    implementation 'com.google.zxing:core:3.5.2'
}
